<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hands That Help NGO - donor and volunteer signup">
    <title>Hands That Help</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <img src="../images/logo.png" alt="Hands That Help NGO logo" width="180">

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger" aria-label="Open navigation menu">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="#/" data-route="/">Home</a></li>
                <li><a href="#/projects" data-route="/projects">Projects</a></li>
                <li><a href="#/signup" data-route="/signup">Sign up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Target container: the router clears and injects the current route HTML here -->
    <main id="app">
        <p>Loading application...</p>
    </main>

    <footer>
        <address>
            <p>Email: contact@handsthathelp.org</p>
            <p>Phone: (16) 3711-0000</p>
            <p>Franca, SP - Brazil</p>
        </address>
    </footer>

    <!-- Order matters: each script depends on the previous one(s) being
         loaded already (data -> templates -> router -> interactions -> storage -> main). -->
    <script src="../js/modules/data.js"></script>
    <script src="../js/modules/templates.js"></script>
    <script src="../js/modules/router.js"></script>
    <script src="../js/modules/interactions.js"></script>
    <script src="../js/modules/storage.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
